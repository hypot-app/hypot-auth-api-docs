# Server block of the documentation site (copied to /etc/nginx/conf.d/default.conf).
# The unprivileged image keeps its pid file and temporary paths under /tmp, so a read-only root needs only a /tmp tmpfs.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    # Pagefind's index, fragments and WebAssembly (*.pagefind, *.pf_*) are already gzip files that its own script unzips,
    # so they are served as application/octet-stream and are not compressed again.
    charset utf-8;
    charset_types text/css application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;
    # HTML and the search index are revalidated on every visit; the hashed build files below are cached for a year.
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Astro names these files after their content, so a file never changes under the same name.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
