<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1287 376" width="1287" height="376" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
<title id="t">Flujo general de inicio de sesión</title>
<desc id="d">La persona envía correo y contraseña a tu frontend; el frontend llama a hypot Auth y recibe los tokens en JSON; luego llama a tu backend con el access token y el backend lo verifica sin llamar a Auth.</desc>
<rect width="1287" height="376" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e293b"/></marker></defs>
<line x1="95" y1="60" x2="95" y2="356" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="25" y="20" width="140" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
<text x="95" y="41" text-anchor="middle" fill="#1e1b4b" font-weight="600">Usuario</text>
<line x1="394" y1="60" x2="394" y2="356" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="324" y="20" width="140" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
<text x="394" y="41" text-anchor="middle" fill="#1e1b4b" font-weight="600">Tu frontend</text>
<line x1="693" y1="60" x2="693" y2="356" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="623" y="20" width="140" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
<text x="693" y="41" text-anchor="middle" fill="#1e1b4b" font-weight="600">hypot Auth</text>
<line x1="992" y1="60" x2="992" y2="356" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="922" y="20" width="140" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
<text x="992" y="41" text-anchor="middle" fill="#1e1b4b" font-weight="600">Tu backend</text>
<line x1="95" y1="86" x2="388" y2="86" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="244.5" y="79" text-anchor="middle" fill="#0f172a">correo y contraseña</text>
<line x1="394" y1="132" x2="687" y2="132" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="543.5" y="125" text-anchor="middle" fill="#0f172a">POST /auth/login</text>
<line x1="693" y1="178" x2="400" y2="178" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="543.5" y="171" text-anchor="middle" fill="#0f172a">access_token + refresh_token (JSON)</text>
<line x1="394" y1="224" x2="986" y2="224" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="693" y="217" text-anchor="middle" fill="#0f172a">API con Authorization: Bearer</text>
<text x="1000" y="270" fill="#334155" font-style="italic">verifica el JWT con la JWKS en caché</text>
<line x1="992" y1="316" x2="400" y2="316" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="693" y="309" text-anchor="middle" fill="#0f172a">respuesta</text>
</svg>
