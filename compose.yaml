# Documentation site for local use, served by `astro preview` at http://localhost:4321
#   docker compose up -d --build
# To update: git pull, git submodule update --init, and the same command again.
services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: hypot-auth-api-docs:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
