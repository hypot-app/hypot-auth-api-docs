# Documentation site behind the host's nginx.
#   docker compose up -d --build
# To update: git pull, git submodule update --init, and the same command again.
services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: hypot-auth-api-docs:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    pids_limit: 64
